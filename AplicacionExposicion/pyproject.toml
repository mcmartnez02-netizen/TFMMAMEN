[tool.app.api]
url = "http://127.0.0.1:8000"
upload_rate = 3
timeout = 30
retry_attempts = 3

[tool.app.api.endpoints]
token_endpoint = "/token/"
upload_endpoint = "/upload/"
count_endpoint = "/runs/heartbeats/count/"
status_endpoint = "/status/"
new_run_endpoint = "/new/"

[tool.detection]
near_height = 0.62
far_height = 0.53
confidence_threshold = 0.5
confidence_keypoint = 0.2 
time_no_presence = 10
max_fps = 2
max_consecutive_erros = 3

[tool.detection.scaling_factors]
nose_ankles    = 1.0
nose_hips      = 1.97
shoulders_hips = 2.7
nose_shoulders = 6.8
eyes           = 22.25